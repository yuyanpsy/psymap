<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽言心理 PsyMap - AI考研备考工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #EF6C00, #FF9800); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { text-align: center; color: white; padding: 40px 20px; max-width: 600px; }
        .logo { width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 24px; background: white; display: flex; align-items: center; justify-content: center; font-size: 48px; }
        h1 { font-size: 36px; margin-bottom: 8px; }
        .slogan { font-size: 16px; opacity: 0.9; margin-bottom: 32px; }
        .desc { font-size: 14px; opacity: 0.85; line-height: 1.8; margin-bottom: 40px; }
        .btn { display: inline-block; background: white; color: #EF6C00; padding: 14px 40px; border-radius: 12px; text-decoration: none; font-size: 16px; font-weight: bold; transition: transform 0.2s; }
        .btn:hover { transform: scale(1.05); }
        .features { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 32px; }
        .feature { background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 20px; font-size: 13px; }
        .footer { margin-top: 40px; font-size: 12px; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🧠</div>
        <h1>羽言心理</h1>
        <p class="slogan">新知 · 成长 · 快乐</p>
        <p class="desc">专为北师大MAP心理学考研设计的AI智能备考工具。<br>题库管理、AI评分、记忆曲线复习、打卡计划，一站式备考。</p>
        <div class="features">
            <span class="feature">📚 题库管理</span>
            <span class="feature">🤖 AI评分</span>
            <span class="feature">📷 拍照识题</span>
            <span class="feature">📅 打卡计划</span>
            <span class="feature">🎧 磨耳朵</span>
            <span class="feature">📖 文献管理</span>
        </div>
        <a class="btn" href="https://github.com/yuyanpsy/psymap/releases">下载最新版本</a>
        <p class="footer">© 2025-2026 羽言心理 | Android 8.0+</p>
    </div>
</body>
</html>
